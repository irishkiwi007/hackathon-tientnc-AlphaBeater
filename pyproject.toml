[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alphabeater"
version = "0.1.0"
description = "An autonomous, risk-gated research-to-paper-trading agent for Alpaca."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "AlphaBeater contributors" }]
dependencies = [
  "alpaca-py>=0.44,<0.45",
  "fastmcp>=3.1,<4",
  "google-genai>=1.0",
  "pandas>=2.2,<4",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
]

[project.scripts]
alphabeater-check = "alphabeater.check_setup:main"
alphabeater-data-check = "alphabeater.check_data:main"
alphabeater-research-demo = "alphabeater.research_demo:main"
alphabeater-monitor = "alphabeater.monitor:main"
alphabeater-mcp-check = "alphabeater.mcp_check:main"
alphabeater-run = "alphabeater.agent_run:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alphabeater"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
